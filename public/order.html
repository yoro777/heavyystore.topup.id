<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Detail Pesanan — HEAVY STORE TOP UP</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#08090b">
  <link rel="icon" href="/assets/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/favicon-180.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
<script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
</head>
<body>
  <div id="site-nav"></div>

  <main id="main" class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <div>
        <span class="eyebrow">PESANAN</span>
        <h1 class="section-title h4 mb-0">Order ID: <span class="mono" id="orderId">-</span></h1>
      </div>
      <div class="d-flex align-items-center gap-2">
        <span id="statusBadge"></span>
        <button id="btnRefresh" class="btn btn-hvy-outline btn-sm"><i class="bi bi-arrow-clockwise me-1"></i>Muat Ulang</button>
      </div>
    </div>

    <div class="hvy-card p-4 mb-4">
      <div class="d-flex align-items-start" id="steps"></div>
    </div>

    <div class="row g-4">
      <div class="col-lg-7">
        <!-- Payment instructions -->
        <div id="payBox" class="hvy-card p-4 mb-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h6 class="fw-bold mb-0"><i class="bi bi-wallet2 me-2"></i>Instruksi Pembayaran</h6>
            <span id="countdown" class="countdown d-none"></span>
          </div>
          <div id="instructions"></div>
        </div>

        <!-- Paid -->
        <div id="paidBox" class="hvy-card p-4 mb-4 d-none">
          <div class="d-flex align-items-center gap-3">
            <div class="success-check"><i class="bi bi-check-lg"></i></div>
            <div id="paidMsg" class="mb-0"></div>
          </div>
        </div>

        <!-- Failed -->
        <div id="failBox" class="hvy-card p-4 mb-4 d-none">
          <div class="d-flex align-items-center gap-3">
            <div class="fs-2 text-danger"><i class="bi bi-x-octagon-fill"></i></div>
            <div id="failMsg" class="mb-0"></div>
          </div>
        </div>

        <!-- Detail -->
        <div class="hvy-card p-4">
          <h6 class="fw-bold mb-3">Detail Pesanan</h6>
          <div class="kv"><span class="k">Game</span><span class="v" id="dGame">-</span></div>
          <div class="kv"><span class="k">Item</span><span class="v" id="dProduct">-</span></div>
          <div class="kv"><span class="k">User ID</span><span class="v mono" id="dUserId">-</span></div>
          <div class="kv"><span class="k">Nickname</span><span class="v" id="dNick">-</span></div>
          <div class="kv"><span class="k">Metode</span><span class="v" id="dMethod">-</span></div>
          <div class="kv"><span class="k">Dibuat</span><span class="v" id="dCreated">-</span></div>
        </div>
      </div>

      <div class="col-lg-5">
        <div class="hvy-card p-4">
          <h6 class="fw-bold mb-3">Rincian Pembayaran</h6>
          <div class="kv"><span class="k">Harga</span><span class="v" id="dBase">Rp0</span></div>
          <div class="kv d-none" id="dDiscountRow"><span class="k">Diskon</span><span class="v text-success" id="dDiscount">Rp0</span></div>
          <div class="kv"><span class="k">Biaya admin</span><span class="v" id="dFee">Rp0</span></div>
          <div class="divider-silver my-3"></div>
          <div class="d-flex justify-content-between align-items-center">
            <span class="fw-bold">Total Bayar</span>
            <span class="fs-4 fw-bold silver-text" id="dTotal">Rp0</span>
          </div>
          <p class="text-muted-2 small mt-3 mb-0"><i class="bi bi-shield-lock me-1"></i>Status pembayaran diverifikasi langsung ke payment gateway.</p>
        </div>
        <div class="hvy-card p-3 mt-3 text-center">
          <div class="small text-muted-2 mb-2">Simpan Order ID untuk cek status kapan saja</div>
          <a href="/check-order.html" class="btn btn-hvy-outline btn-sm w-100"><i class="bi bi-search me-1"></i>Cek Pesanan Lain</a>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <nav id="bottom-nav"></nav>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/order.js"></script>
</body>
</html>
