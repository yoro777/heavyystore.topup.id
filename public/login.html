<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Masuk — HEAVY STORE TOP UP</title>
  <meta name="description" content="Masuk ke akun HEAVY STORE TOP UP untuk top up game favoritmu lebih cepat dan aman.">
  <meta name="theme-color" content="#08090b">
  <link rel="icon" href="/assets/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/favicon-180.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
<script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
</head>
<body data-auth="login">
  <div id="site-nav"></div>

  <main id="main" class="container py-4 py-lg-5">
    <div class="row justify-content-center">
      <div class="col-lg-5 col-md-7">
        <div class="auth-card hvy-card p-4 p-lg-5">
          <div class="text-center mb-4">
            <img src="/assets/logo.png" alt="HEAVY STORE TOP UP" class="auth-logo mb-3">
            <h1 class="section-title h4 mb-1">Masuk Akun</h1>
            <p class="text-muted-2 mb-0">Top up lebih cepat, pantau pesanan di satu tempat.</p>
          </div>

          <div id="authError" class="alert alert-danger d-none" role="alert"></div>

          <form id="loginForm" novalidate>
            <div class="mb-3">
              <label for="identifier" class="form-label">Email / Username</label>
              <div class="input-group">
                <span class="input-group-text bg-transparent border-secondary-subtle"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control" id="identifier" name="identifier" autocomplete="username" placeholder="email@contoh.com atau username" required>
                <div class="invalid-feedback">Wajib diisi</div>
              </div>
            </div>

            <div class="mb-2">
              <label for="password" class="form-label">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-transparent border-secondary-subtle"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" placeholder="••••••••" required>
                <button class="btn btn-outline-secondary" type="button" id="togglePw" tabindex="-1"><i class="bi bi-eye"></i></button>
                <div class="invalid-feedback">Wajib diisi</div>
              </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="remember" checked>
                <label class="form-check-label small text-muted-2" for="remember">Ingat saya</label>
              </div>
              <a href="/bantuan.html" class="small text-decoration-none">Lupa password?</a>
            </div>

            <button type="submit" class="btn btn-hvy w-100 btn-lg" id="btnSubmit">
              <i class="bi bi-box-arrow-in-right me-2"></i>Masuk
            </button>
          </form>

          <div class="divider-silver my-4"></div>
          <p class="text-center text-muted-2 mb-0">
            Belum punya akun? <a href="/register.html" class="fw-semibold text-decoration-none silver-text">Daftar sekarang</a>
          </p>
        </div>

        <p class="text-center small text-muted-2 mt-3 mb-0">
          <i class="bi bi-shield-lock me-1"></i>Koneksi terenkripsi. Kami tidak pernah menyimpan password dalam bentuk teks.
        </p>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <nav id="bottom-nav"></nav>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
