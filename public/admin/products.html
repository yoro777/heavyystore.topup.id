<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Produk — Admin HEAVY STORE TOP UP</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#08090b">
  <link rel="icon" href="/assets/favicon-32.png" sizes="32x32">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin.css">
<script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar" id="adminSidebar"></aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <div class="admin-main">
      <header class="admin-topbar" id="adminTopbar"></header>
      <main class="admin-content">
        <div class="admin-toolbar mb-3">
          <select class="form-select" id="fGame"><option value="">Semua game</option></select>
          <input type="search" class="form-control" id="fSearch" placeholder="Cari produk...">
          <div class="spacer"></div>
          <button class="btn btn-hvy" id="btnAdd"><i class="bi bi-plus-lg me-1"></i>Tambah Produk</button>
        </div>

        <div class="hvy-card p-0">
          <div class="hvy-table-wrap">
            <table class="hvy-table">
              <thead><tr><th>Produk</th><th>Game</th><th>Harga Supplier</th><th>Harga Jual</th><th>Margin</th><th>Promo</th><th>Status</th><th></th></tr></thead>
              <tbody id="tbody"><tr><td colspan="8" class="text-center py-4"><div class="spinner-border spinner-border-sm text-secondary"></div></td></tr></tbody>
            </table>
          </div>
        </div>
        <p class="text-muted-2 small mt-2"><i class="bi bi-info-circle me-1"></i>Harga jual final dihitung otomatis di server dari harga supplier + margin (tidak pernah di bawah biaya). Field harga jual di sini hanya override manual opsional.</p>
      </main>
    </div>
  </div>

  <div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="modalTitle">Tambah Produk</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <div id="formError" class="alert alert-danger d-none"></div>
          <form id="productForm">
            <input type="hidden" id="pId">
            <div class="row g-3">
              <div class="col-md-6"><label class="form-label">Game *</label><select class="form-select" id="pGame" required></select></div>
              <div class="col-md-6"><label class="form-label">Supplier</label><select class="form-select" id="pSupplier"><option value="">— tidak ada —</option></select></div>
              <div class="col-md-6"><label class="form-label">Nama Produk *</label><input class="form-control" id="pName" placeholder="Diamond 100" required></div>
              <div class="col-md-6"><label class="form-label">Denominasi</label><input class="form-control" id="pDenom" placeholder="100 Diamonds"></div>
              <div class="col-md-6"><label class="form-label">Kode Supplier</label><input class="form-control mono" id="pCode" placeholder="FF100"></div>
              <div class="col-md-6"><label class="form-label">Harga Supplier (Rp) *</label><input type="number" class="form-control" id="pCost" min="0" required></div>

              <div class="col-12"><div class="divider-silver my-1"></div><div class="text-muted-2 small">Pengaturan Margin (dipakai server bila harga jual kosong)</div></div>
              <div class="col-md-4"><label class="form-label">Tipe Margin</label><select class="form-select" id="pMarginType"><option value="percent">Persen (%)</option><option value="fixed">Nominal (Rp)</option></select></div>
              <div class="col-md-4"><label class="form-label">Nilai Margin</label><input type="number" class="form-control" id="pMarginValue" value="8" min="0"></div>
              <div class="col-md-4"><label class="form-label">Harga Jual Override (Rp)</label><input type="number" class="form-control" id="pSelling" min="0" placeholder="kosong = otomatis"></div>

              <div class="col-md-4"><label class="form-label">Harga Minimum (Rp)</label><input type="number" class="form-control" id="pMin" value="0" min="0"></div>
              <div class="col-md-4"><label class="form-label">Maks. Diskon (Rp)</label><input type="number" class="form-control" id="pMaxDisc" value="0" min="0"></div>
              <div class="col-md-4"><label class="form-label">Harga Promo (Rp)</label><input type="number" class="form-control" id="pPromo" min="0" placeholder="opsional"></div>

              <div class="col-md-4"><label class="form-label">Stok <span class="text-muted-2 small">(kosong = ∞)</span></label><input type="number" class="form-control" id="pStock"></div>
              <div class="col-md-4"><label class="form-label">Urutan</label><input type="number" class="form-control" id="pSort" value="0"></div>
              <div class="col-md-4 d-flex flex-column justify-content-end gap-2">
                <div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="pIsPromo"><label class="form-check-label" for="pIsPromo">Tandai Promo</label></div>
              </div>
              <div class="col-md-6"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="pActive" checked><label class="form-check-label" for="pActive">Aktif</label></div></div>
              <div class="col-md-6"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="pMaintenance"><label class="form-check-label" for="pMaintenance">Maintenance</label></div></div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button class="btn btn-hvy-ghost" data-bs-dismiss="modal">Batal</button>
          <button class="btn btn-hvy" id="btnSave"><i class="bi bi-check2 me-1"></i>Simpan</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/admin/js/admin-common.js"></script>
  <script>
    (function () {
      'use strict';
      const el = (id) => document.getElementById(id);
      let PRODUCTS = [], GAMES = [], SUPPLIERS = [];

      function fillSelects() {
        el('fGame').innerHTML = '<option value="">Semua game</option>' + GAMES.map((g) => '<option value="' + g.id + '">' + HVY.escapeHtml(g.name) + '</option>').join('');
        el('pGame').innerHTML = GAMES.map((g) => '<option value="' + g.id + '">' + HVY.escapeHtml(g.name) + '</option>').join('');
        el('pSupplier').innerHTML = '<option value="">— tidak ada —</option>' + SUPPLIERS.map((s) => '<option value="' + s.id + '">' + HVY.escapeHtml(s.name) + ' (' + s.code + ')</option>').join('');
      }

      function marginLabel(p) {
        if (p.selling_price) return '<span class="text-info">Override</span>';
        return p.margin_type === 'percent' ? p.margin_value + '%' : HVY.fmt(p.margin_value);
      }

      function render() {
        const q = el('fSearch').value.toLowerCase();
        const gid = el('fGame').value;
        const list = PRODUCTS.filter((p) =>
          (!gid || String(p.game_id) === gid) &&
          (p.name.toLowerCase().includes(q) || (p.game_name || '').toLowerCase().includes(q))
        );
        el('tbody').innerHTML = list.length ? list.map(function (p) {
          return '<tr>' +
            '<td><div class="fw-semibold">' + HVY.escapeHtml(p.name) + '</div><div class="text-muted-2 small mono">' + HVY.escapeHtml(p.supplier_code || '-') + '</div></td>' +
            '<td>' + HVY.escapeHtml(p.game_name || '-') + '</td>' +
            '<td>' + HVY.fmt(p.supplier_cost) + '</td>' +
            '<td>' + (p.selling_price ? HVY.fmt(p.selling_price) : '<span class="text-muted-2">auto</span>') + '</td>' +
            '<td>' + marginLabel(p) + '</td>' +
            '<td>' + (p.is_promo ? '<span class="badge-status st-success">Promo</span>' : '<span class="text-muted-2">—</span>') + '</td>' +
            '<td>' + (p.is_maintenance ? '<span class="badge-status st-failed">Maint.</span>' : p.is_active ? '<span class="badge-status st-success">Aktif</span>' : '<span class="badge-status st-expired">Off</span>') + '</td>' +
            '<td class="text-nowrap">' +
              '<button class="btn btn-hvy-ghost btn-sm" data-edit="' + p.id + '"><i class="bi bi-pencil"></i></button> ' +
              '<button class="btn btn-hvy-ghost btn-sm text-danger" data-del="' + p.id + '"><i class="bi bi-trash"></i></button>' +
            '</td>' +
          '</tr>';
        }).join('') : '<tr><td colspan="8" class="text-center text-muted-2 py-4">Tidak ada produk</td></tr>';
        el('tbody').querySelectorAll('button[data-edit]').forEach((b) => b.addEventListener('click', () => openEdit(Number(b.dataset.edit))));
        el('tbody').querySelectorAll('button[data-del]').forEach((b) => b.addEventListener('click', () => del(Number(b.dataset.del))));
      }

      function openAdd() {
        el('modalTitle').textContent = 'Tambah Produk';
        el('productForm').reset();
        el('pId').value = '';
        el('pMarginValue').value = 8;
        el('pMin').value = 0; el('pMaxDisc').value = 0; el('pSort').value = 0;
        el('pActive').checked = true;
        el('formError').classList.add('d-none');
        ADMIN.showModal('editModal');
      }

      function openEdit(id) {
        const p = PRODUCTS.find((x) => x.id === id);
        if (!p) return;
        el('modalTitle').textContent = 'Edit Produk';
        el('pId').value = p.id;
        el('pGame').value = p.game_id;
        el('pSupplier').value = p.supplier_id || '';
        el('pName').value = p.name || '';
        el('pDenom').value = p.denomination || '';
        el('pCode').value = p.supplier_code || '';
        el('pCost').value = p.supplier_cost;
        el('pMarginType').value = p.margin_type || 'percent';
        el('pMarginValue').value = p.margin_value;
        el('pSelling').value = p.selling_price || '';
        el('pMin').value = p.min_price || 0;
        el('pMaxDisc').value = p.max_discount || 0;
        el('pPromo').value = p.promo_price || '';
        el('pStock').value = p.stock == null ? '' : p.stock;
        el('pSort').value = p.sort_order || 0;
        el('pIsPromo').checked = !!p.is_promo;
        el('pActive').checked = !!p.is_active;
        el('pMaintenance').checked = !!p.is_maintenance;
        el('formError').classList.add('d-none');
        ADMIN.showModal('editModal');
      }

      async function save() {
        const id = el('pId').value;
        const payload = {
          game_id: Number(el('pGame').value),
          supplier_id: el('pSupplier').value ? Number(el('pSupplier').value) : null,
          name: el('pName').value.trim(),
          denomination: el('pDenom').value.trim() || null,
          supplier_code: el('pCode').value.trim() || null,
          supplier_cost: Number(el('pCost').value),
          margin_type: el('pMarginType').value,
          margin_value: Number(el('pMarginValue').value) || 0,
          selling_price: el('pSelling').value === '' ? null : Number(el('pSelling').value),
          min_price: Number(el('pMin').value) || 0,
          max_discount: Number(el('pMaxDisc').value) || 0,
          promo_price: el('pPromo').value === '' ? null : Number(el('pPromo').value),
          stock: el('pStock').value === '' ? null : Number(el('pStock').value),
          sort_order: Number(el('pSort').value) || 0,
          is_promo: el('pIsPromo').checked,
          is_active: el('pActive').checked,
          is_maintenance: el('pMaintenance').checked,
        };
        if (!payload.name || !payload.game_id || isNaN(payload.supplier_cost)) {
          el('formError').textContent = 'Nama, game, dan harga supplier wajib diisi'; el('formError').classList.remove('d-none'); return;
        }
        const btn = el('btnSave');
        HVY.setLoading(btn, true);
        try {
          if (id) await ADMIN.api.updateProduct(Number(id), payload);
          else await ADMIN.api.createProduct(payload);
          HVY.toast('Produk disimpan', 'success');
          ADMIN.hideModal('editModal');
          await load();
        } catch (err) {
          el('formError').textContent = err.message; el('formError').classList.remove('d-none');
        } finally { HVY.setLoading(btn, false); }
      }

      async function del(id) {
        const p = PRODUCTS.find((x) => x.id === id);
        const ok = await ADMIN.confirmAction('Hapus produk "' + (p ? p.name : '') + '"?', { danger: true, okText: 'Hapus' });
        if (!ok) return;
        try { await ADMIN.api.deleteProduct(id); HVY.toast('Produk dihapus', 'success'); await load(); }
        catch (err) { HVY.toast(err.message, 'danger'); }
      }

      async function load() {
        try {
          const [pr, gm, sp] = await Promise.all([ADMIN.api.products({}), ADMIN.api.games(), ADMIN.api.suppliers()]);
          PRODUCTS = pr.products || [];
          GAMES = gm.games || [];
          SUPPLIERS = sp.suppliers || [];
          fillSelects();
          render();
        } catch (err) {
          el('tbody').innerHTML = '<tr><td colspan="8" class="text-center text-danger py-4">' + HVY.escapeHtml(err.message) + '</td></tr>';
        }
      }

      document.addEventListener('DOMContentLoaded', async function () {
        const adm = await ADMIN.mountShell('products');
        if (!adm) return;
        el('btnAdd').addEventListener('click', openAdd);
        el('btnSave').addEventListener('click', save);
        el('fSearch').addEventListener('input', HVY.debounce(render, 180));
        el('fGame').addEventListener('change', render);
        load();
      });
    })();
  </script>
</body>
</html>
