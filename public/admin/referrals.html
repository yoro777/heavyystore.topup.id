<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Referral — Admin HEAVY STORE TOP UP</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#08090b">
  <link rel="icon" href="/assets/favicon-32.png" sizes="32x32">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin.css">
<script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar" id="adminSidebar"></aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <div class="admin-main">
      <header class="admin-topbar" id="adminTopbar"></header>
      <main class="admin-content">
        <div class="admin-toolbar mb-3">
          <div class="spacer"></div>
          <button class="btn btn-hvy" id="btnAdd"><i class="bi bi-plus-lg me-1"></i>Buat Kode Referral</button>
        </div>

        <div class="hvy-card p-0">
          <div class="hvy-table-wrap">
            <table class="hvy-table">
              <thead><tr><th>Kode</th><th>Diskon</th><th>Min. Transaksi</th><th>Maks. Diskon</th><th>Pemakaian</th><th>Pemilik</th><th>Status</th><th></th></tr></thead>
              <tbody id="tbody"><tr><td colspan="8" class="text-center py-4"><div class="spinner-border spinner-border-sm text-secondary"></div></td></tr></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="modalTitle">Buat Kode Referral</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <div id="formError" class="alert alert-danger d-none"></div>
          <form id="refForm">
            <input type="hidden" id="rId">
            <div class="row g-3">
              <div class="col-12"><label class="form-label">Kode *</label><input class="form-control mono text-uppercase" id="rCode" placeholder="HEAVY10" required></div>
              <div class="col-12"><label class="form-label">Deskripsi</label><input class="form-control" id="rDesc" placeholder="Diskon 10% maksimal Rp10.000"></div>
              <div class="col-md-6"><label class="form-label">Tipe Diskon</label><select class="form-select" id="rType"><option value="percent">Persen (%)</option><option value="fixed">Nominal (Rp)</option></select></div>
              <div class="col-md-6"><label class="form-label">Nilai Diskon *</label><input type="number" class="form-control" id="rValue" min="0" required></div>
              <div class="col-md-6"><label class="form-label">Min. Transaksi (Rp)</label><input type="number" class="form-control" id="rMin" value="0" min="0"></div>
              <div class="col-md-6"><label class="form-label">Maks. Diskon (Rp) <span class="text-muted-2 small">0=tanpa batas</span></label><input type="number" class="form-control" id="rMax" value="0" min="0"></div>
              <div class="col-md-6"><label class="form-label">Batas Pemakaian <span class="text-muted-2 small">0=∞</span></label><input type="number" class="form-control" id="rLimit" value="0" min="0"></div>
              <div class="col-md-6"><label class="form-label">ID Customer (opsional)</label><input type="number" class="form-control" id="rUser" placeholder="kosong = publik"></div>
              <div class="col-md-6"><label class="form-label">Mulai</label><input type="datetime-local" class="form-control" id="rStart"></div>
              <div class="col-md-6"><label class="form-label">Berakhir</label><input type="datetime-local" class="form-control" id="rEnd"></div>
              <div class="col-12"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="rActive" checked><label class="form-check-label" for="rActive">Aktif</label></div></div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button class="btn btn-hvy-ghost" data-bs-dismiss="modal">Batal</button>
          <button class="btn btn-hvy" id="btnSave"><i class="bi bi-check2 me-1"></i>Simpan</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/admin/js/admin-common.js"></script>
  <script>
    (function () {
      'use strict';
      const el = (id) => document.getElementById(id);
      let REFS = [];

      function discountLabel(r) {
        return r.discount_type === 'percent' ? r.discount_value + '%' : HVY.fmt(r.discount_value);
      }

      function render() {
        el('tbody').innerHTML = REFS.length ? REFS.map(function (r) {
          const usage = r.usage_limit > 0 ? (r.actual_usages + ' / ' + r.usage_limit) : (r.actual_usages + ' / ∞');
          return '<tr>' +
            '<td><span class="mono fw-bold silver-text">' + HVY.escapeHtml(r.code) + '</span><div class="text-muted-2 small">' + HVY.escapeHtml(r.description || '') + '</div></td>' +
            '<td>' + discountLabel(r) + '</td>' +
            '<td>' + HVY.fmt(r.min_transaction) + '</td>' +
            '<td>' + (r.max_discount > 0 ? HVY.fmt(r.max_discount) : '∞') + '</td>' +
            '<td>' + usage + '</td>' +
            '<td>' + (r.user_username ? HVY.escapeHtml(r.user_username) : '<span class="text-muted-2">Publik</span>') + '</td>' +
            '<td>' + (r.is_active ? '<span class="badge-status st-success">Aktif</span>' : '<span class="badge-status st-expired">Off</span>') + '</td>' +
            '<td class="text-nowrap">' +
              '<button class="btn btn-hvy-ghost btn-sm" data-edit="' + r.id + '"><i class="bi bi-pencil"></i></button> ' +
              '<button class="btn btn-hvy-ghost btn-sm text-danger" data-del="' + r.id + '"><i class="bi bi-trash"></i></button>' +
            '</td>' +
          '</tr>';
        }).join('') : '<tr><td colspan="8" class="text-center text-muted-2 py-4">Belum ada kode referral</td></tr>';
        el('tbody').querySelectorAll('button[data-edit]').forEach((b) => b.addEventListener('click', () => openEdit(Number(b.dataset.edit))));
        el('tbody').querySelectorAll('button[data-del]').forEach((b) => b.addEventListener('click', () => del(Number(b.dataset.del))));
      }

      function toLocalInput(iso) {
        if (!iso) return '';
        const d = new Date(iso);
        const pad = (n) => String(n).padStart(2, '0');
        return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
      }

      function openAdd() {
        el('modalTitle').textContent = 'Buat Kode Referral';
        el('refForm').reset();
        el('rId').value = '';
        el('rMin').value = 0; el('rMax').value = 0; el('rLimit').value = 0;
        el('rActive').checked = true;
        el('formError').classList.add('d-none');
        ADMIN.showModal('editModal');
      }

      function openEdit(id) {
        const r = REFS.find((x) => x.id === id);
        if (!r) return;
        el('modalTitle').textContent = 'Edit Kode Referral';
        el('rId').value = r.id;
        el('rCode').value = r.code;
        el('rDesc').value = r.description || '';
        el('rType').value = r.discount_type;
        el('rValue').value = r.discount_value;
        el('rMin').value = r.min_transaction;
        el('rMax').value = r.max_discount;
        el('rLimit').value = r.usage_limit;
        el('rUser').value = r.user_id || '';
        el('rStart').value = toLocalInput(r.start_date);
        el('rEnd').value = toLocalInput(r.end_date);
        el('rActive').checked = !!r.is_active;
        el('formError').classList.add('d-none');
        ADMIN.showModal('editModal');
      }

      async function save() {
        const id = el('rId').value;
        const payload = {
          code: el('rCode').value.trim().toUpperCase(),
          description: el('rDesc').value.trim() || null,
          discount_type: el('rType').value,
          discount_value: Number(el('rValue').value),
          min_transaction: Number(el('rMin').value) || 0,
          max_discount: Number(el('rMax').value) || 0,
          usage_limit: Number(el('rLimit').value) || 0,
          user_id: el('rUser').value ? Number(el('rUser').value) : null,
          start_date: el('rStart').value ? new Date(el('rStart').value).toISOString() : null,
          end_date: el('rEnd').value ? new Date(el('rEnd').value).toISOString() : null,
          is_active: el('rActive').checked,
        };
        if (!payload.code || isNaN(payload.discount_value)) {
          el('formError').textContent = 'Kode dan nilai diskon wajib diisi'; el('formError').classList.remove('d-none'); return;
        }
        const btn = el('btnSave');
        HVY.setLoading(btn, true);
        try {
          if (id) await ADMIN.api.updateReferral(Number(id), payload);
          else await ADMIN.api.createReferral(payload);
          HVY.toast('Kode referral disimpan', 'success');
          ADMIN.hideModal('editModal');
          await load();
        } catch (err) {
          el('formError').textContent = err.message; el('formError').classList.remove('d-none');
        } finally { HVY.setLoading(btn, false); }
      }

      async function del(id) {
        const r = REFS.find((x) => x.id === id);
        const ok = await ADMIN.confirmAction('Hapus kode referral "' + (r ? r.code : '') + '"?', { danger: true, okText: 'Hapus' });
        if (!ok) return;
        try { await ADMIN.api.deleteReferral(id); HVY.toast('Kode referral dihapus', 'success'); await load(); }
        catch (err) { HVY.toast(err.message, 'danger'); }
      }

      async function load() {
        try {
          const res = await ADMIN.api.referrals();
          REFS = res.referrals || [];
          render();
        } catch (err) {
          el('tbody').innerHTML = '<tr><td colspan="8" class="text-center text-danger py-4">' + HVY.escapeHtml(err.message) + '</td></tr>';
        }
      }

      document.addEventListener('DOMContentLoaded', async function () {
        const adm = await ADMIN.mountShell('referrals');
        if (!adm) return;
        el('btnAdd').addEventListener('click', openAdd);
        el('btnSave').addEventListener('click', save);
        load();
      });
    })();
  </script>
</body>
</html>
