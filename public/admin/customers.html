<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Customer — Admin HEAVY STORE TOP UP</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#08090b">
  <link rel="icon" href="/assets/favicon-32.png" sizes="32x32">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin.css">
<script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar" id="adminSidebar"></aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <div class="admin-main">
      <header class="admin-topbar" id="adminTopbar"></header>
      <main class="admin-content">
        <div class="admin-toolbar mb-3">
          <input type="search" class="form-control" id="fSearch" placeholder="Cari username / email / telepon / kode referral">
          <select class="form-select" id="fStatus">
            <option value="">Semua status</option>
            <option value="active">Aktif</option>
            <option value="suspended">Suspended</option>
          </select>
          <div class="spacer"></div>
          <button class="btn btn-hvy btn-sm" id="btnApply"><i class="bi bi-funnel me-1"></i>Terapkan</button>
        </div>

        <div class="hvy-card p-0">
          <div class="hvy-table-wrap">
            <table class="hvy-table">
              <thead><tr><th>Customer</th><th>Kontak</th><th>Referral</th><th>Transaksi</th><th>Total Belanja</th><th>Status</th><th>Terdaftar</th><th></th></tr></thead>
              <tbody id="tbody"><tr><td colspan="8" class="text-center py-4"><div class="spinner-border spinner-border-sm text-secondary"></div></td></tr></tbody>
            </table>
          </div>
          <div class="pagination-hvy pb-3" id="pager"></div>
        </div>
      </main>
    </div>
  </div>

  <div class="modal fade" id="detailModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title"><i class="bi bi-person me-2"></i>Detail Customer</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body" id="detailBody"></div>
        <div class="modal-footer">
          <button class="btn btn-hvy-outline" id="btnResetPw"><i class="bi bi-key me-1"></i>Reset Password</button>
          <button class="btn btn-hvy" id="btnToggleStatus"><i class="bi bi-toggle2-on me-1"></i>Ubah Status</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/admin/js/admin-common.js"></script>
  <script>
    (function () {
      'use strict';
      const el = (id) => document.getElementById(id);
      const LIMIT = 25;
      let offset = 0, CUR = null, TOTAL = 0;

      function statusBadge(s) {
        return s === 'active' ? '<span class="badge-status st-success">Aktif</span>' : '<span class="badge-status st-failed">Suspended</span>';
      }

      function render(res) {
        TOTAL = res.total;
        const rows = res.customers || [];
        el('tbody').innerHTML = rows.length ? rows.map(function (c) {
          return '<tr>' +
            '<td><div class="fw-semibold">' + HVY.escapeHtml(c.username) + '</div><div class="text-muted-2 small mono">#' + c.id + '</div></td>' +
            '<td>' + HVY.escapeHtml(c.email) + '<div class="text-muted-2 small">' + HVY.escapeHtml(c.phone || '-') + '</div></td>' +
            '<td class="mono">' + HVY.escapeHtml(c.referral_code || '-') + '</td>' +
            '<td>' + c.total_transactions + '</td>' +
            '<td class="fw-bold">' + HVY.fmt(c.total_spent || 0) + '</td>' +
            '<td>' + statusBadge(c.status) + '</td>' +
            '<td class="text-muted-2 small">' + HVY.fmtDate(c.created_at) + '</td>' +
            '<td><button class="btn btn-hvy-ghost btn-sm" data-id="' + c.id + '"><i class="bi bi-eye"></i></button></td>' +
          '</tr>';
        }).join('') : '<tr><td colspan="8" class="text-center text-muted-2 py-4">Tidak ada customer</td></tr>';
        ADMIN.renderPagination('pager', { total: TOTAL, limit: LIMIT, offset, onChange: (o) => { offset = o; load(); } });
        el('tbody').querySelectorAll('button[data-id]').forEach((b) => b.addEventListener('click', () => openDetail(Number(b.dataset.id))));
      }

      function kv(k, v) { return '<div class="kv"><span class="k">' + k + '</span><span class="v">' + v + '</span></div>'; }

      async function openDetail(id) {
        try {
          const res = await ADMIN.api.customer(id);
          CUR = res.customer;
          const orders = res.orders || [];
          el('detailBody').innerHTML =
            '<div class="d-flex justify-content-between align-items-center mb-3"><div><div class="fw-bold fs-5">' + HVY.escapeHtml(CUR.username) + '</div><div class="text-muted-2 small">#' + CUR.id + '</div></div>' + statusBadge(CUR.status) + '</div>' +
            '<div class="row g-3">' +
              '<div class="col-md-6">' +
                kv('Email', HVY.escapeHtml(CUR.email)) +
                kv('Telepon', HVY.escapeHtml(CUR.phone || '-')) +
                kv('Kode Referral', '<span class="mono">' + HVY.escapeHtml(CUR.referral_code || '-') + '</span>') +
                kv('Dipakai dari', HVY.escapeHtml(CUR.referred_by || '-')) +
                kv('Terdaftar', HVY.fmtDate(CUR.created_at)) +
                kv('Login terakhir', CUR.last_login_at ? HVY.fmtDate(CUR.last_login_at) : '-') +
              '</div>' +
              '<div class="col-md-6">' +
                kv('Total transaksi', res.stats.total_transactions) +
                kv('Total belanja (sukses)', '<span class="silver-text fw-bold">' + HVY.fmt(res.stats.total_spent) + '</span>') +
              '</div>' +
            '</div>' +
            '<h6 class="text-muted-2 small text-uppercase mt-4 mb-2">Pesanan Terakhir</h6>' +
            (orders.length ? '<div class="hvy-table-wrap"><table class="hvy-table"><thead><tr><th>Order</th><th>Item</th><th>Total</th><th>Status</th></tr></thead><tbody>' +
              orders.map((o) => '<tr><td class="mono">' + HVY.escapeHtml(o.order_id) + '</td><td>' + HVY.escapeHtml(o.product ? o.product.name : '-') + '</td><td>' + HVY.fmt(o.grand_total) + '</td><td>' + ADMIN.topupBadge(o.status) + '</td></tr>').join('') +
              '</tbody></table></div>' : '<div class="text-muted-2 small">Belum ada pesanan.</div>');
          ADMIN.showModal('detailModal');
        } catch (err) { HVY.toast(err.message, 'danger'); }
      }

      async function load() {
        el('tbody').innerHTML = '<tr><td colspan="8" class="text-center py-4"><div class="spinner-border spinner-border-sm text-secondary"></div></td></tr>';
        try {
          const res = await ADMIN.api.customers({ limit: LIMIT, offset, search: el('fSearch').value.trim() || undefined, status: el('fStatus').value || undefined });
          render(res);
        } catch (err) {
          el('tbody').innerHTML = '<tr><td colspan="8" class="text-center text-danger py-4">' + HVY.escapeHtml(err.message) + '</td></tr>';
        }
      }

      document.addEventListener('DOMContentLoaded', async function () {
        const adm = await ADMIN.mountShell('customers');
        if (!adm) return;
        el('btnApply').addEventListener('click', () => { offset = 0; load(); });
        el('fSearch').addEventListener('keydown', (e) => { if (e.key === 'Enter') { offset = 0; load(); } });
        el('fStatus').addEventListener('change', () => { offset = 0; load(); });

        el('btnToggleStatus').addEventListener('click', async function () {
          if (!CUR) return;
          const action = CUR.status === 'active' ? 'suspend' : 'activate';
          const ok = await ADMIN.confirmAction((action === 'suspend' ? 'Suspend' : 'Aktifkan') + ' customer "' + CUR.username + '"?', { danger: action === 'suspend', okText: 'Lanjutkan' });
          if (!ok) return;
          try {
            await ADMIN.api.customerAction(CUR.id, { action });
            HVY.toast('Status customer diubah', 'success');
            ADMIN.hideModal('detailModal');
            await load();
          } catch (err) { HVY.toast(err.message, 'danger'); }
        });

        el('btnResetPw').addEventListener('click', async function () {
          if (!CUR) return;
          const pw = prompt('Masukkan password baru (min. 8 karakter) untuk ' + CUR.username + ':');
          if (!pw) return;
          try {
            await ADMIN.api.customerAction(CUR.id, { action: 'reset_password', password: pw });
            HVY.toast('Password customer direset', 'success');
          } catch (err) { HVY.toast(err.message, 'danger'); }
        });

        load();
      });
    })();
  </script>
</body>
</html>
