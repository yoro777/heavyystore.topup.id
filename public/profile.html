<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Akun Saya — HEAVY STORE TOP UP</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#08090b">
  <link rel="icon" href="/assets/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/favicon-180.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
<script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
</head>
<body>
  <div id="site-nav"></div>

  <main id="main" class="container py-4">
    <!-- Profile header -->
    <div class="hvy-card p-4 mb-4">
      <div class="row align-items-center g-3">
        <div class="col-auto">
          <div class="avatar-circle" id="avatar">H</div>
        </div>
        <div class="col">
          <div class="eyebrow">AKUN SAYA</div>
          <h1 class="section-title h4 mb-1" id="uName">—</h1>
          <div class="text-muted-2 small">
            <span id="uEmail" class="me-3"><i class="bi bi-envelope me-1"></i>—</span>
            <span id="uPhone"><i class="bi bi-whatsapp me-1"></i>—</span>
          </div>
        </div>
        <div class="col-auto">
          <button class="btn btn-hvy-outline btn-sm" id="btnLogout"><i class="bi bi-box-arrow-right me-1"></i>Keluar</button>
        </div>
      </div>

      <div class="divider-silver my-4"></div>

      <div class="row g-3 text-center">
        <div class="col-4">
          <div class="stat-mini"><div class="v" id="sTotal">0</div><div class="k">Transaksi</div></div>
        </div>
        <div class="col-4">
          <div class="stat-mini"><div class="v" id="sSuccess">0</div><div class="k">Berhasil</div></div>
        </div>
        <div class="col-4">
          <div class="stat-mini"><div class="v silver-text" id="sSpent">Rp0</div><div class="k">Total Belanja</div></div>
        </div>
      </div>

      <div class="referral-box mt-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
          <div>
            <div class="small text-muted-2">Kode Referral Kamu</div>
            <div class="fs-5 fw-bold mono silver-text" id="uRef">—</div>
          </div>
          <button class="btn btn-hvy btn-sm" id="btnCopyRef"><i class="bi bi-clipboard me-1"></i>Salin</button>
        </div>
        <div class="small text-muted-2 mt-2"><i class="bi bi-gift me-1"></i>Bagikan kode ini. Temanmu dapat diskon, kamu dapat benefit.</div>
      </div>
    </div>

    <!-- Tabs -->
    <ul class="nav nav-pills hvy-tabs mb-3" id="profileTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="tab-orders-btn" data-bs-toggle="pill" data-bs-target="#tab-orders" type="button" role="tab">
          <i class="bi bi-receipt me-1"></i>Riwayat Pesanan
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="tab-notif-btn" data-bs-toggle="pill" data-bs-target="#tab-notif" type="button" role="tab">
          <i class="bi bi-bell me-1"></i>Notifikasi <span class="badge rounded-pill bg-danger ms-1 d-none" id="notifCount">0</span>
        </button>
      </li>
    </ul>

    <div class="tab-content">
      <!-- Orders -->
      <div class="tab-pane fade show active" id="tab-orders" role="tabpanel">
        <div class="d-flex flex-wrap gap-2 mb-3" id="orderFilters">
          <button class="chip active" data-status="">Semua</button>
          <button class="chip" data-status="PENDING">Menunggu Bayar</button>
          <button class="chip" data-status="PAID">Dibayar</button>
          <button class="chip" data-status="PROCESSING">Diproses</button>
          <button class="chip" data-status="SUCCESS">Berhasil</button>
          <button class="chip" data-status="FAILED">Gagal</button>
        </div>
        <div id="ordersList"><div class="skeleton skeleton-card"></div></div>
      </div>

      <!-- Notifications -->
      <div class="tab-pane fade" id="tab-notif" role="tabpanel">
        <div class="d-flex justify-content-end mb-2">
          <button class="btn btn-hvy-ghost btn-sm" id="btnReadAll"><i class="bi bi-check2-all me-1"></i>Tandai semua dibaca</button>
        </div>
        <div id="notifList"><div class="skeleton skeleton-card"></div></div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <nav id="bottom-nav"></nav>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
