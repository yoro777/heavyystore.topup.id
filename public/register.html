<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Daftar — HEAVY STORE TOP UP</title>
  <meta name="description" content="Daftar akun HEAVY STORE TOP UP gratis. Dapatkan kode referral dan diskon untuk setiap top up game.">
  <meta name="theme-color" content="#08090b">
  <link rel="icon" href="/assets/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/favicon-180.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
<script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
</head>
<body data-auth="register">
  <div id="site-nav"></div>

  <main id="main" class="container py-4 py-lg-5">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-8">
        <div class="auth-card hvy-card p-4 p-lg-5">
          <div class="text-center mb-4">
            <img src="/assets/logo.png" alt="HEAVY STORE TOP UP" class="auth-logo mb-3">
            <h1 class="section-title h4 mb-1">Buat Akun Baru</h1>
            <p class="text-muted-2 mb-0">Gratis, cepat, dan dapat diskon referral.</p>
          </div>

          <div id="authError" class="alert alert-danger d-none" role="alert"></div>

          <form id="registerForm" novalidate>
            <div class="row g-3">
              <div class="col-sm-6">
                <label for="username" class="form-label">Username</label>
                <div class="input-group">
                  <span class="input-group-text bg-transparent border-secondary-subtle"><i class="bi bi-at"></i></span>
                  <input type="text" class="form-control" id="username" name="username" autocomplete="username" placeholder="heavyuser" required>
                  <div class="invalid-feedback"></div>
                </div>
              </div>
              <div class="col-sm-6">
                <label for="phone" class="form-label">No. WhatsApp</label>
                <div class="input-group">
                  <span class="input-group-text bg-transparent border-secondary-subtle"><i class="bi bi-whatsapp"></i></span>
                  <input type="tel" class="form-control" id="phone" name="phone" autocomplete="tel" placeholder="08xxxxxxxxxx" required>
                  <div class="invalid-feedback"></div>
                </div>
              </div>

              <div class="col-12">
                <label for="email" class="form-label">Email</label>
                <div class="input-group">
                  <span class="input-group-text bg-transparent border-secondary-subtle"><i class="bi bi-envelope"></i></span>
                  <input type="email" class="form-control" id="email" name="email" autocomplete="email" placeholder="email@contoh.com" required>
                  <div class="invalid-feedback"></div>
                </div>
              </div>

              <div class="col-sm-6">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-transparent border-secondary-subtle"><i class="bi bi-lock"></i></span>
                  <input type="password" class="form-control" id="password" name="password" autocomplete="new-password" placeholder="Min. 8 karakter" required>
                  <div class="invalid-feedback"></div>
                </div>
                <div class="progress mt-2" style="height:5px;">
                  <div class="progress-bar" id="pwMeter" style="width:0%"></div>
                </div>
              </div>
              <div class="col-sm-6">
                <label for="confirm" class="form-label">Konfirmasi Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-transparent border-secondary-subtle"><i class="bi bi-lock-fill"></i></span>
                  <input type="password" class="form-control" id="confirm" name="confirm" autocomplete="new-password" placeholder="Ulangi password" required>
                  <div class="invalid-feedback"></div>
                </div>
              </div>

              <div class="col-12">
                <label for="referral_code" class="form-label">Kode Referral <span class="text-muted-2 small">(opsional)</span></label>
                <div class="input-group">
                  <span class="input-group-text bg-transparent border-secondary-subtle"><i class="bi bi-gift"></i></span>
                  <input type="text" class="form-control mono text-uppercase" id="referral_code" name="referral_code" placeholder="HEAVY10">
                </div>
                <div class="form-text">Punya kode dari teman? Masukkan untuk dapat diskon.</div>
              </div>
            </div>

            <div class="form-check my-4">
              <input class="form-check-input" type="checkbox" id="agree" required>
              <label class="form-check-label small text-muted-2" for="agree">
                Saya setuju dengan <a href="/terms.html" class="text-decoration-none silver-text">Syarat &amp; Ketentuan</a> dan <a href="/privacy.html" class="text-decoration-none silver-text">Kebijakan Privasi</a>.
              </label>
            </div>

            <button type="submit" class="btn btn-hvy w-100 btn-lg" id="btnSubmit">
              <i class="bi bi-person-plus me-2"></i>Daftar Sekarang
            </button>
          </form>

          <div class="divider-silver my-4"></div>
          <p class="text-center text-muted-2 mb-0">
            Sudah punya akun? <a href="/login.html" class="fw-semibold text-decoration-none silver-text">Masuk di sini</a>
          </p>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <nav id="bottom-nav"></nav>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
